<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="description" content="Planeador semanal de recetas y lista de compras." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Grimorio · Ritual semanal</title>
  </head>
  <body>
    <a class="skip-link" href="#schedule">Saltar al menú semanal</a>
    <main class="app">
      <header class="hero">
        <div class="brand">
          <div class="logo" aria-hidden="true">G</div>
          <div>
            <h1>Grimorio</h1>
            <p>Recetas, semana y compras en un solo ritual.</p>
          </div>
        </div>
        <nav class="hero-actions" aria-label="Acciones del menú">
          <button class="btn primary" id="autoFillBtn">✨ Crear semana</button>
          <button class="btn colorful" id="shoppingBtn">🛒 Compras</button>
          <button class="btn" id="recipesBtn">✎ Mis recetas</button>
          <button class="btn" id="exportBtn" aria-label="Exportar planeación">⤴ Exportar</button>
          <button class="btn" id="importBtn" aria-label="Importar planeación">⤵ Importar</button>
          <button class="btn danger" id="clearBtn">✕ Limpiar</button>
        </nav>
      </header>

      <section class="layout">
        <aside class="panel" aria-labelledby="recipesHeading">
          <div class="panel-heading">
            <div>
              <h2 id="recipesHeading">Códice de recetas</h2>
              <p class="panel-sub">Elige un espacio y asigna una receta.</p>
            </div>
            <button class="btn compact" id="newRecipeBtn">+ Nueva</button>
          </div>
          <div class="search-row">
            <label
              ><span>Buscar</span
              ><input class="input" id="searchInput" placeholder="Nombre o ingrediente…"
            /></label>
            <label
              ><span>Tiempo</span
              ><select class="select" id="typeFilter">
                <option value="all">Todos</option>
                <option value="desayuno">Desayuno</option>
                <option value="comida">Comida</option>
                <option value="colacion">Colación</option>
                <option value="cena">Cena</option>
              </select></label
            >
          </div>
          <div class="chips" id="tagFilters" aria-label="Filtrar por proteína"></div>
          <div class="recipe-list" id="recipeList" aria-live="polite"></div>
        </aside>

        <section class="schedule-wrap" aria-labelledby="scheduleHeading">
          <div class="schedule-head">
            <div>
              <h2 id="scheduleHeading">Ritual semanal</h2>
              <p class="panel-sub" id="selectedHint">Elige un espacio para asignar una receta.</p>
            </div>
            <button class="btn compact hidden" id="undoBtn">Deshacer</button>
          </div>
          <div class="mobile-days" id="mobileDays" role="tablist" aria-label="Días"></div>
          <div class="schedule" id="schedule"></div>
        </section>
      </section>
    </main>

    <div class="backdrop" id="backdrop" hidden></div>
    <section
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="icon-btn" id="drawerClose" aria-label="Cerrar">✕</button>
      </div>
      <div id="drawerText"></div>
      <textarea class="input export-box hidden" id="jsonBox" aria-label="Datos JSON"></textarea>
      <form id="recipeForm" class="recipe-form hidden"></form>
      <div class="drawer-actions">
        <button class="btn primary" id="drawerPrimary"></button
        ><button class="btn" id="drawerSecondary">Cerrar</button>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
