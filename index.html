<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Planeador semanal de recetas y lista de compras." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Grimorio · Ritual semanal</title>
  </head>
  <body>
    <a class="skip-link" href="#schedule">Saltar al menú semanal</a>
    <main class="app">
      <header class="hero">
        <div class="brand">
          <div class="logo" aria-hidden="true">G</div>
          <div>
            <h1>Grimorio</h1>
            <p>Planear bien. Comprar justo. Cocinar tranquilo.</p>
          </div>
        </div>
        <nav class="hero-actions" aria-label="Acciones del menú">
          <button
            class="ritual-action ritual-main ritual-week"
            id="autoFillBtn"
            aria-label="Crear semana automáticamente"
          >
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Zm4 8h2m2 0h2m-6 4h2m2 0h2"
                /></svg></span
            ><span class="ritual-label">Semana</span>
          </button>
          <button
            class="ritual-action ritual-main ritual-shopping"
            id="shoppingBtn"
            aria-label="Abrir lista de compras"
          >
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path d="M6 8h12l1 13H5L6 8Zm3 0a3 3 0 0 1 6 0m-5 6 1.5 1.5L15 12" /></svg></span
            ><span class="ritual-label">Compras</span>
          </button>
          <button
            class="ritual-action ritual-main ritual-recipes"
            id="recipesBtn"
            aria-label="Administrar mis recetas"
          >
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path
                  d="M4 5a3 3 0 0 1 3-2h5v17H7a3 3 0 0 0-3 2V5Zm16 0a3 3 0 0 0-3-2h-5v17h5a3 3 0 0 1 3 2V5Z"
                /></svg></span
            ><span class="ritual-label">Recetas</span>
          </button>
          <span class="action-separator" aria-hidden="true"></span>
          <button class="ritual-action ritual-tool" id="exportBtn" aria-label="Exportar planeación">
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M5 14v7h14v-7" /></svg></span
            ><span class="ritual-label">Exportar</span>
          </button>
          <button class="ritual-action ritual-tool" id="importBtn" aria-label="Importar planeación">
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M5 14v7h14v-7" /></svg></span
            ><span class="ritual-label">Importar</span>
          </button>
          <button
            class="ritual-action ritual-tool ritual-clear"
            id="clearBtn"
            aria-label="Limpiar menú semanal"
          >
            <span class="ritual-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path d="M4 7h16M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6" /></svg></span
            ><span class="ritual-label">Limpiar</span>
          </button>
        </nav>
      </header>

      <section class="layout">
        <aside class="panel" aria-labelledby="recipesHeading">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">Paso 2</span>
              <h2 id="recipesHeading">Elige una receta</h2>
              <p class="panel-sub">Usa los filtros o asigna directamente.</p>
            </div>
            <button
              class="btn compact icon-action"
              id="newRecipeBtn"
              aria-label="Crear una receta"
              title="Crear receta"
            >
              ＋<span class="sr-only">Crear receta</span>
            </button>
          </div>
          <div class="search-row">
            <label
              ><span>Buscar (opcional)</span
              ><span class="search-control"
                ><input
                  class="input"
                  id="searchInput"
                  type="search"
                  placeholder="Nombre o ingrediente…"
                  autocomplete="off"
                /><button
                  class="clear-search hidden"
                  id="clearSearchBtn"
                  type="button"
                  aria-label="Borrar búsqueda"
                >
                  ✕
                </button></span
              ></label
            >
            <label
              ><span>Tiempo</span
              ><select class="select" id="typeFilter">
                <option value="all">Todos</option>
                <option value="desayuno">Desayuno</option>
                <option value="comida">Comida</option>
                <option value="colacion">Colación</option>
                <option value="cena">Cena</option>
              </select></label
            >
          </div>
          <div class="chips" id="tagFilters" aria-label="Filtrar por proteína"></div>
          <div class="recipe-list" id="recipeList" aria-live="polite"></div>
        </aside>

        <section class="schedule-wrap" aria-labelledby="scheduleHeading">
          <div class="schedule-head">
            <div>
              <span class="eyebrow">Paso 1</span>
              <h2 id="scheduleHeading">Tu semana</h2>
              <p class="selection-status" id="selectedHint" role="status" aria-live="polite">
                Selecciona un espacio vacío o una receta para cambiarla.
              </p>
            </div>
            <button
              class="btn compact icon-action hidden"
              id="undoBtn"
              aria-label="Deshacer último cambio"
              title="Deshacer"
            >
              ↶<span class="sr-only">Deshacer</span>
            </button>
          </div>
          <div class="mobile-days" id="mobileDays" role="tablist" aria-label="Días"></div>
          <div class="schedule" id="schedule"></div>
        </section>
      </section>
    </main>

    <div class="backdrop" id="backdrop" hidden></div>
    <section
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      hidden
    >
      <div class="drawer-head">
        <h2 id="drawerTitle"></h2>
        <button class="icon-btn" id="drawerClose" aria-label="Cerrar">✕</button>
      </div>
      <div id="drawerText"></div>
      <textarea class="input export-box hidden" id="jsonBox" aria-label="Datos JSON"></textarea>
      <form id="recipeForm" class="recipe-form hidden"></form>
      <div class="drawer-actions">
        <button class="btn primary" id="drawerPrimary"></button
        ><button class="btn" id="drawerSecondary">Cerrar</button>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
